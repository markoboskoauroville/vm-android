# Mantra Bus: two 32-channel virtual audio devices (the Linux side of the Mac driver).
#   Mantra Bus Send    a DAW plays into it, Mantra SonoBus reads it and sends it to other machines
#   Mantra Bus Return  Mantra SonoBus plays what it receives into it, a DAW records its monitor
# Installed by install-linux.sh as ~/.config/pipewire/pipewire.conf.d/mantra-bus.conf
context.objects = [
    { factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "mantra_bus_send"
            node.description = "Mantra Bus Send"
            media.class      = Audio/Sink
            audio.channels   = 32
            audio.position   = [ AUX0 AUX1 AUX2 AUX3 AUX4 AUX5 AUX6 AUX7 AUX8 AUX9 AUX10 AUX11 AUX12 AUX13 AUX14 AUX15 AUX16 AUX17 AUX18 AUX19 AUX20 AUX21 AUX22 AUX23 AUX24 AUX25 AUX26 AUX27 AUX28 AUX29 AUX30 AUX31 ]
            object.linger    = true
            monitor.channel-volumes = false
        }
    }
    { factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "mantra_bus_return"
            node.description = "Mantra Bus Return"
            media.class      = Audio/Sink
            audio.channels   = 32
            audio.position   = [ AUX0 AUX1 AUX2 AUX3 AUX4 AUX5 AUX6 AUX7 AUX8 AUX9 AUX10 AUX11 AUX12 AUX13 AUX14 AUX15 AUX16 AUX17 AUX18 AUX19 AUX20 AUX21 AUX22 AUX23 AUX24 AUX25 AUX26 AUX27 AUX28 AUX29 AUX30 AUX31 ]
            object.linger    = true
            monitor.channel-volumes = false
        }
    }
]
